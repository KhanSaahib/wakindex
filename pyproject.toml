# Description: Python packaging, dependencies, CLI entry point, and quality-tool configuration.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wakindex-security"
dynamic = ["version"]
description = "Inventory and policy-check permissions for AI agents, MCP servers, and skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "wakindex contributors" }]
keywords = ["ai-security", "mcp", "agents", "permissions", "github-actions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.6,<1"]

[project.scripts]
wakindex = "wakindex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wakindex"]

[tool.hatch.version]
path = "src/wakindex/__init__.py"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# The policy fuzzer needs a seeded, reproducible generator. A cryptographic one would make a
# failure impossible to reproduce, which is the opposite of what a fuzzer is for.
"tests/test_capability_policy_fuzz.py" = ["S101", "S311"]
"src/wakindex/dashboard.py" = ["E501"]
"src/wakindex/ui.py" = ["E501"]
